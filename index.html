<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Accession Log</title>
<script src="https://cdn.jsdelivr.net/npm/piexifjs@1.0.6/piexif.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/idb-keyval@6/dist/umd.js"></script>
<style>
  :root{
    --ink:#eae3d3;
    --charcoal:#1b1a18;
    --tag:#c98a3e;
    --paper:#efe8d8;
    --paper-line:#c9bfa4;
    --teal:#4c6b64;
    --danger:#a8503f;
    --mono: 'Courier New', ui-monospace, monospace;
    --serif: Georgia, 'Times New Roman', serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--charcoal); color:var(--ink);
    font-family:var(--serif);
    display:flex; flex-direction:column; height:100dvh; height:100vh;
    overflow-x:hidden; overflow-y:auto; /* scroll is a fallback only — sizing below aims to avoid ever needing it */
  }
  header{
    padding:10px 16px 8px; display:flex; align-items:baseline; justify-content:space-between;
    border-bottom:1px solid #35322d; flex-shrink:0;
  }
  header .title{font-family:var(--mono); letter-spacing:2px; font-size:12px; color:var(--tag); text-transform:uppercase;}
  header .count{font-family:var(--mono); font-size:12px; color:#8a8577;}
  nav{display:flex; gap:0; flex-shrink:0;}
  nav button{
    flex:1; background:none; border:none; color:#8a8577; font-family:var(--mono);
    font-size:11px; letter-spacing:1px; text-transform:uppercase; padding:8px 0; border-bottom:2px solid transparent;
  }
  nav button.active{color:var(--tag); border-bottom-color:var(--tag);}
  #storageNotice{
    background:#3a2f1c; color:#e8c98a; font-family:var(--mono); font-size:11px;
    line-height:1.5; padding:10px 18px; border-bottom:1px solid #5a4a2a; flex-shrink:0;
  }

  /* min-height:0 on every nested flex container below is what actually lets
     children shrink smaller than their natural content size — without it,
     flexbox refuses to shrink a column below its content height, which is
     exactly what causes overflow/scrolling on short screens (e.g. a
     foldable's small cover display) instead of everything fitting. */
  main{flex:1; display:flex; flex-direction:column; padding:12px; min-height:0;}

  /* --- CAPTURE VIEW --- */
  .card{
    background:var(--paper); color:#2a2620; border-radius:2px;
    padding:14px; flex:1; display:flex; flex-direction:column; min-height:0;
    box-shadow:0 8px 24px rgba(0,0,0,.35);
    position:relative;
  }

  .photo-slot{
    flex:1 1 90px; min-height:90px; border:1.5px dashed var(--paper-line); border-radius:2px;
    display:flex; align-items:center; justify-content:center; overflow:hidden;
    background:#e4dcc7; position:relative;
  }
  /* object-fit:contain (not cover) so the preview always shows the photo's
     true aspect ratio — letterboxed if needed, never stretched/cropped. */
  .photo-slot img{
    width:100%; height:100%; object-fit:contain; display:block;
    transform-origin:0 0; touch-action:none; /* touch-action:none hands the gesture to our own JS instead of the browser's native pinch-zoom */
  }
  .photo-slot .hint{font-family:var(--mono); font-size:12px; color:#9a9075; text-align:center; padding:20px;}
  input[type=file]{
    position:absolute; width:1px; height:1px; padding:0; margin:-1px;
    overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;
  }

  /* Bottom row: two equal-size buttons. Back always navigates. Forward
     either steps to the next existing item, or — when you're at the
     newest item (or there are none yet) — opens the camera for a new one;
     its label/behavior switches automatically (see renderCurrentItem). */
  .nav-row{ display:flex; gap:8px; margin-top:10px; flex-shrink:0; }
  .nav-btn{
    flex:1; padding:14px 4px; border:none; border-radius:2px; background:var(--charcoal);
    color:var(--ink); font-family:var(--mono); font-size:12px; letter-spacing:0.5px; text-transform:uppercase;
    display:flex; align-items:center; justify-content:center; text-align:center;
    cursor:pointer; user-select:none; -webkit-user-select:none; white-space:nowrap;
  }
  .nav-btn:active:not(:disabled){background:#000;}
  .nav-btn:disabled{opacity:.28; cursor:default;}
  .nav-btn.disabled{opacity:.28; cursor:default; pointer-events:none;}

  /* Note area sized in em (scales with font-size) and given a flex-shrink
     of its own so on a very short screen it gives up some height before
     anything else has to — it can still hold/scroll 5 lines of typed text
     even if fewer are visible at once when squeezed. */
  #noteBox{
    margin-top:10px; width:100%; font-family:var(--serif); font-size:16px; padding:8px 10px;
    border:1px solid var(--paper-line); border-radius:2px; background:#fff; color:#2a2620;
    resize:vertical; min-height:5em; max-height:8.5em; line-height:1.4; flex-shrink:1;
  }
  .note-hint{font-family:var(--mono); font-size:11px; color:#9a9075; margin-top:5px; flex-shrink:0;}

  /* Compact mode for short viewports — a foldable's cover screen, or any
     phone in a squat aspect ratio. Trims padding and secondary text so the
     essentials (photo, buttons, note box) keep priority for space. */
  @media (max-height: 720px){
    header{padding:6px 14px 5px;}
    header .title{font-size:10px;}
    nav button{padding:6px 0; font-size:10px;}
    main{padding:8px;}
    .card{padding:8px;}
    .photo-slot{flex-basis:60px; min-height:60px;}
    .nav-row{margin-top:6px;}
    .nav-btn{padding:10px 6px; font-size:12px;}
    #noteBox{margin-top:6px; min-height:3.6em; font-size:14px; padding:6px 8px;}
    .note-hint{display:none;} /* informational only — first thing to drop when space is tight */
  }
  @media (max-height: 480px){
    .photo-slot{flex-basis:40px; min-height:40px;}
    #noteBox{min-height:2.8em;}
  }

  /* --- LOG VIEW --- */
  .entry{
    display:flex; gap:12px; padding:12px 0; border-bottom:1px solid #35322d;
  }
  .entry img{width:64px; height:64px; object-fit:cover; border-radius:2px; flex-shrink:0; background:#333;}
  .entry .meta{font-family:var(--mono); font-size:10px; color:var(--tag); letter-spacing:1px;}
  .entry .note{font-size:15px; line-height:1.35; margin-top:2px;}
  .entry .del{background:none; border:none; color:#6b6858; font-family:var(--mono); font-size:11px; margin-top:6px;}
  .empty{font-family:var(--mono); color:#6b6858; font-size:13px; text-align:center; margin-top:60px;}
  .export-btn{
    margin-top:14px; padding:14px; border:1px solid #4a463c; border-radius:2px; background:none;
    color:var(--ink); font-family:var(--mono); font-size:12px; letter-spacing:1px; text-transform:uppercase;
    width:100%;
  }
  .export-btn.primary{background:var(--tag); color:#1b1a18; border-color:var(--tag); font-weight:bold;}
  .toast{
    position:fixed; bottom:18px; left:50%; transform:translateX(-50%);
    background:var(--tag); color:#1b1a18; padding:8px 16px; border-radius:2px;
    font-family:var(--mono); font-size:12px; opacity:0; transition:opacity .25s; pointer-events:none;
    max-width:85%; text-align:center;
  }
  .toast.show{opacity:1;}
</style>
</head>
<body>

<header>
  <div class="title">Accession Log</div>
  <div class="count" id="countLabel">No. 001</div>
</header>
<div id="storageNotice" style="display:none;"></div>
<nav>
  <button id="tabCapture" class="active">Capture</button>
  <button id="tabLog">Log (<span id="logTabCount">0</span>)</button>
</nav>

<main>
  <!-- CAPTURE VIEW -->
  <div id="captureView" class="card">
    <div class="photo-slot" id="photoSlot">
      <div class="hint">Press › below to photograph the item</div>
    </div>
    <input type="file" id="fileInput" accept="image/*" capture="environment">

    <div class="nav-row">
      <button type="button" id="backBtn" class="nav-btn" aria-label="Previous item" disabled>‹ Back</button>
      <label class="nav-btn" id="retakeBtn" aria-label="Retake photo">↻ Retake</label>
      <label class="nav-btn" id="forwardBtn" for="fileInput" aria-label="Next item / photograph new item">📷 New Item</label>
    </div>

    <textarea id="noteBox" rows="5" placeholder="Type a note — or tap the mic icon on your keyboard to dictate"></textarea>
    <div class="note-hint">Full note is saved into the photo's file (EXIF). Only the first 5 lines are burned onto the photo itself. Edits save automatically.</div>
  </div>

  <!-- LOG VIEW -->
  <div id="logView" style="display:none; flex:1; overflow-y:auto;">
    <button class="export-btn primary" id="exportAllBtn">⬇ Export all as .zip</button>
    <button class="export-btn" id="exportTextBtn">Copy full log as text</button>
    <div id="entryList" style="margin-top:6px;"></div>
    <div class="empty" id="emptyMsg">No items logged yet.</div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
const photoSlot = document.getElementById('photoSlot');
const fileInput = document.getElementById('fileInput');
const noteBox = document.getElementById('noteBox');
const backBtn = document.getElementById('backBtn');
const retakeBtn = document.getElementById('retakeBtn');
const forwardBtn = document.getElementById('forwardBtn');
const countLabel = document.getElementById('countLabel');
const logTabCount = document.getElementById('logTabCount');
const tabCapture = document.getElementById('tabCapture');
const tabLog = document.getElementById('tabLog');
const captureView = document.getElementById('captureView');
const logView = document.getElementById('logView');
const entryList = document.getElementById('entryList');
const emptyMsg = document.getElementById('emptyMsg');
const exportAllBtn = document.getElementById('exportAllBtn');
const exportTextBtn = document.getElementById('exportTextBtn');
const toast = document.getElementById('toast');

// ============================================================
// TUNABLE SETTINGS — safe to hand-edit these values directly.
// ============================================================
let PHOTO_MAX_W = 1600;   // max photo width in pixels before saving (bigger = sharper but larger files)
let PHOTO_QUALITY = 0.82; // JPEG quality 0..1 (bigger = sharper but larger files)

// FONT SIZE: the burned-in caption's text height, as a fraction of the
// photo's own height. 1/32 means, e.g., a 1600px-tall photo gets ~50px text.
const ANNOTATION_FONT_HEIGHT_FRACTION = 1/32;
// Caption is capped at this many visible lines (the full note always still
// goes into EXIF regardless of this limit — this only affects what's drawn
// on top of the photo).
const ANNOTATION_MAX_LINES = 5;
// How long to wait after the user stops typing before auto-saving a note
// edit (and re-burning the caption). Short enough to feel instant, long
// enough not to re-encode the image on every keystroke.
const NOTE_AUTOSAVE_DELAY_MS = 700;
const ZOOM_MIN = 1;   // never zoom out past the photo's normal fit-to-box size
const ZOOM_MAX = 4;   // cap how far in you can pinch-zoom

// ---------- two-finger pinch-zoom / pan on the displayed photo ----------
// Purely a viewing convenience: it only changes how the <img> is displayed
// on screen right now (via a CSS transform), never the saved photo data —
// so it doesn't touch storage, EXIF, annotation, or export at all. Resets
// to normal (via resetZoom()) every time a different or newly-captured
// photo is shown, so you never land on a photo still zoomed from before.
let zoomState = { scale: 1, x: 0, y: 0 };
let pinchLastDist = 0;
let pinchLastMid = null;

function resetZoom(){
  zoomState = { scale: 1, x: 0, y: 0 };
  applyZoomTransform();
}
function applyZoomTransform(){
  const img = photoSlot.querySelector('img');
  if(img) img.style.transform = `translate(${zoomState.x}px, ${zoomState.y}px) scale(${zoomState.scale})`;
}
function touchDistance(t0, t1){
  const dx = t0.clientX - t1.clientX, dy = t0.clientY - t1.clientY;
  return Math.sqrt(dx*dx + dy*dy);
}
function touchMidpoint(t0, t1, rect){
  return { x: (t0.clientX + t1.clientX)/2 - rect.left, y: (t0.clientY + t1.clientY)/2 - rect.top };
}

photoSlot.addEventListener('touchstart', (e)=>{
  if(e.touches.length !== 2 || !photoSlot.querySelector('img')) return;
  e.preventDefault();
  const rect = photoSlot.getBoundingClientRect();
  pinchLastDist = touchDistance(e.touches[0], e.touches[1]);
  pinchLastMid = touchMidpoint(e.touches[0], e.touches[1], rect);
}, { passive: false });

photoSlot.addEventListener('touchmove', (e)=>{
  if(e.touches.length !== 2 || !pinchLastMid) return;
  e.preventDefault();
  const rect = photoSlot.getBoundingClientRect();
  const dist = touchDistance(e.touches[0], e.touches[1]);
  const mid = touchMidpoint(e.touches[0], e.touches[1], rect);
  const scaleDelta = dist / pinchLastDist;

  // Anchor the zoom at the pinch midpoint: the image point currently under
  // the fingers stays under the fingers as scale and midpoint both change.
  const newScale = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, zoomState.scale * scaleDelta));
  const appliedDelta = newScale / zoomState.scale; // actual delta after clamping
  zoomState.x = mid.x - (pinchLastMid.x - zoomState.x) * appliedDelta;
  zoomState.y = mid.y - (pinchLastMid.y - zoomState.y) * appliedDelta;
  zoomState.scale = newScale;

  pinchLastDist = dist;
  pinchLastMid = mid;
  applyZoomTransform();
}, { passive: false });

photoSlot.addEventListener('touchend', (e)=>{
  if(e.touches.length < 2) pinchLastMid = null;
});

// ---------- navigation model ----------
// `entries` holds every saved item, sorted by capture time. `cursor` always
// points at a real, existing item (0..entries.length-1) once there is at
// least one — there's no separate "blank slot" state anymore. Instead:
//   - Back always steps to the previous existing item.
//   - Forward steps to the next existing item UNLESS you're already at the
//     newest one (or there are no items yet), in which case it opens the
//     camera to capture a brand-new item.
//   - Tapping the photo itself always opens the camera: it retakes the
//     currently-viewed item's photo, or — if there are no items yet —
//     captures the very first one.
// `captureMode` records which of those two the file picker was opened for,
// so the change handler below knows whether to create a new entry or
// overwrite the one being viewed.
let entries = [];
let cursor = 0;
let captureMode = 'new'; // 'new' | 'retake' — set right before the file picker opens
let noteSaveTimer = null;

function showToast(msg){
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(()=>toast.classList.remove('show'), 1600);
}

// Produces a sortable, filesystem-safe timestamp like "2026_10_31_222135"
// (year_month_day_HHMMSS) — used as BOTH each item's accession number
// (in place of the old sequential "No. 004") and its filename inside the
// exported zip, so an item's number always tells you exactly when it was
// captured.
function timestampString(d){
  d = d || new Date();
  const p2 = n => String(n).padStart(2,'0');
  return d.getFullYear() + '_' + p2(d.getMonth()+1) + '_' + p2(d.getDate())
    + '_' + p2(d.getHours()) + p2(d.getMinutes()) + p2(d.getSeconds());
}

// Generates this item's permanent id at the moment it's captured. Two
// photos taken in the same second would otherwise collide, so on a
// collision this appends _2, _3, etc. until it finds a free one.
function generateEntryId(){
  const base = timestampString();
  if(!entries.some(e => e.id === base)) return base;
  let n = 2;
  while(entries.some(e => e.id === base + '_' + n)) n++;
  return base + '_' + n;
}

// ---------- storage (IndexedDB via idb-keyval; localStorage as a verified fallback) ----------
// IMPORTANT: checking `typeof idbKeyval !== 'undefined'` only proves the LIBRARY loaded —
// it does NOT prove IndexedDB actually works here. Many browsers block IndexedDB entirely
// for pages opened as a local file:// (as opposed to a real https:// page), even though the
// idb-keyval script itself loads fine. That mismatch was the actual cause of "Save failed":
// every save silently tried to open a database that the browser refuses to create.
// So we don't trust the mere presence of the library — we run a real write/delete and see
// if it actually works, then commit to whichever backend actually functions.
let storageBackend = null; // 'idb' | 'ls', set by detectStorageBackend() before first use
const LS_PREFIX = 'packinglog:';

async function detectStorageBackend(){
  if(typeof idbKeyval !== 'undefined'){
    try{
      await idbKeyval.set('__cap_test__', 1);
      await idbKeyval.del('__cap_test__');
      return 'idb';
    }catch(e){
      console.warn('IndexedDB present but not usable here (likely a local file:// restriction) — falling back to localStorage.', e);
    }
  }
  return 'ls';
}

// Thin wrapper so the rest of the app doesn't care which backend is active —
// it always calls store.set/get/del/keys and this routes to whichever one
// detectStorageBackend() decided actually works.
const store = {
  async set(key, value){
    if(storageBackend === 'idb') return idbKeyval.set(key, value);
    localStorage.setItem(LS_PREFIX+key, JSON.stringify(value));
  },
  async get(key){
    if(storageBackend === 'idb') return idbKeyval.get(key);
    const v = localStorage.getItem(LS_PREFIX+key);
    return v===null ? undefined : JSON.parse(v);
  },
  async del(key){
    if(storageBackend === 'idb') return idbKeyval.del(key);
    localStorage.removeItem(LS_PREFIX+key);
  },
  async keys(){
    if(storageBackend === 'idb') return idbKeyval.keys();
    const out = [];
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(k && k.startsWith(LS_PREFIX)) out.push(k.slice(LS_PREFIX.length));
    }
    return out;
  }
};

// Pulls every saved entry back out of storage on startup and rebuilds
// in-memory state. Starts the cursor on the blank "new item" slot.
async function loadEntries(){
  let keys = [];
  try{ keys = await store.keys(); }catch(e){ keys = []; }
  const entryKeys = keys.filter(k => typeof k === 'string' && k.indexOf('entry:') === 0);
  const loaded = [];
  for(const k of entryKeys){
    try{
      const e = await store.get(k);
      if(e) loaded.push(e);
    }catch(e){}
  }
  loaded.sort((a,b)=>a.time-b.time);
  entries = loaded;
  cursor = Math.max(0, entries.length - 1); // start on the newest item (irrelevant if there are none yet)
  logTabCount.textContent = entries.length;
  renderLog();
  renderCurrentItem();
}

// Rebuilds the Log tab: a flat, newest-first list of every saved item,
// each with a delete control.
function renderLog(){
  entryList.innerHTML = '';
  emptyMsg.style.display = entries.length ? 'none' : 'block';

  entries.slice().reverse().forEach(e=>{
    const div = document.createElement('div');
    div.className = 'entry';
    div.innerHTML = `
      <img src="${e.photo}">
      <div style="flex:1;">
        <div class="meta">No. ${e.id} — ${new Date(e.time).toLocaleString()}</div>
        <div class="note">${e.note ? e.note.replace(/</g,'&lt;') : '<span style="color:#6b6858">(no note)</span>'}</div>
        <button class="del" data-idx="${e.id}">remove</button>
      </div>`;
    entryList.appendChild(div);
  });

  entryList.querySelectorAll('.del').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const idx = btn.getAttribute('data-idx');
      try{ await store.del('entry:'+idx); }catch(e){}
      entries = entries.filter(e=>String(e.id) !== String(idx));
      cursor = Math.max(0, Math.min(cursor, entries.length - 1));
      logTabCount.textContent = entries.length;
      renderLog();
      renderCurrentItem();
    });
  });
}

// ---------- photo capture: read, auto-rotate per EXIF orientation, compress ----------
// Reads a File (e.g. straight from the camera) into a base64 data: URL.
function readAsDataURL(file){
  return new Promise((resolve,reject)=>{
    const r = new FileReader();
    r.onload = e=>resolve(e.target.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}
// Loads a data: URL (or any src) into an <img>, resolving once it's decoded
// and ready to be drawn onto a canvas.
function loadImage(src){
  return new Promise((resolve,reject)=>{
    const img = new Image();
    img.onload = ()=>resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}

// Takes the raw photo file straight from the camera and produces a
// size-capped JPEG data: URL.
//
// NOTE on rotation: this used to also read the EXIF orientation tag and
// manually rotate the canvas to correct it. That turned out to be the
// cause of landscape photos coming out rotated: modern mobile browsers
// already apply EXIF orientation themselves when decoding an image for
// an <img>/Image() — by the time `img` below is ready, its pixels are
// already upright. Rotating again on top of that double-rotates the
// photo. Portrait shots looked fine only by coincidence (their
// orientation tag needs no rotation either way), which is what made this
// easy to miss. So: no manual rotation — just resize.
async function compressAndOrient(file){
  const dataUrl = await readAsDataURL(file);
  const img = await loadImage(dataUrl);
  const maxW = PHOTO_MAX_W;
  const scale = Math.min(1, maxW/img.width);
  const w = img.width*scale, h = img.height*scale;

  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = w;
  canvas.height = h;
  ctx.drawImage(img,0,0,w,h);
  return canvas.toDataURL('image/jpeg', PHOTO_QUALITY); // final compressed photo (this is the "clean" basePhoto)
}

// ---------- burn a readable caption directly into the photo pixels ----------
// Font size is fixed at ANNOTATION_FONT_HEIGHT_FRACTION of the photo's own
// height (see FONT SIZE setting above) — it does NOT grow/shrink based on
// how much text there is. Longer notes just wrap onto more lines instead,
// up to ANNOTATION_MAX_LINES; anything beyond that is cut off with "..."
// on the photo, though the FULL note still goes into EXIF regardless.
// Always runs against the entry's untouched basePhoto, never against an
// already-annotated image — otherwise edits would stack captions on top
// of each other.
async function annotatePhoto(dataUrl, note){
  if(!note) return dataUrl; // nothing to burn in — EXIF alone still carries an empty note
  const img = await loadImage(dataUrl);
  const canvas = document.createElement('canvas');
  canvas.width = img.width;
  canvas.height = img.height;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(img, 0, 0);

  const maxTextWidth = img.width * 0.90;
  const fontSize = img.height * ANNOTATION_FONT_HEIGHT_FRACTION; // FONT SIZE — see setting above

  ctx.font = '700 ' + fontSize + 'px Arial, sans-serif';

  // word-wrap the note at this fixed font size
  const words = note.split(/\s+/);
  let lines = [];
  let line = '';
  for(const w of words){
    const test = line ? line + ' ' + w : w;
    if(ctx.measureText(test).width > maxTextWidth && line){
      lines.push(line);
      line = w;
    } else {
      line = test;
    }
  }
  if(line) lines.push(line);

  // cap at ANNOTATION_MAX_LINES visible lines; mark truncation with "..."
  // trimmed to fit the same max width as everything else.
  if(lines.length > ANNOTATION_MAX_LINES){
    lines = lines.slice(0, ANNOTATION_MAX_LINES);
    let lastLine = lines[ANNOTATION_MAX_LINES-1];
    while(lastLine.length > 0 && ctx.measureText(lastLine + '...').width > maxTextWidth){
      lastLine = lastLine.slice(0, -1).trimEnd();
    }
    lines[ANNOTATION_MAX_LINES-1] = lastLine + '...';
  }

  const lineHeight = fontSize * 1.28;
  const blockHeight = lines.length * lineHeight;
  const paddingBottom = img.height * 0.035;
  let y = img.height - paddingBottom - blockHeight + lineHeight * 0.8;

  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';
  ctx.lineJoin = 'round';
  ctx.miterLimit = 2;
  ctx.lineWidth = fontSize * 0.16;
  ctx.strokeStyle = '#000000'; // black outline + white fill: readable against any background
  ctx.fillStyle = '#ffffff';

  const cx = img.width / 2;
  lines.forEach(l=>{
    ctx.strokeText(l, cx, y);
    ctx.fillText(l, cx, y);
    y += lineHeight;
  });

  return canvas.toDataURL('image/jpeg', PHOTO_QUALITY);
}

// ---------- EXIF write ----------
// Always embeds the FULL, untruncated note — independent of whatever
// got cut off in the on-photo caption above.
function embedNoteAsExif(jpegDataUrl, note){
  try{
    const exifObj = {"0th":{}, "Exif":{}, "GPS":{}};
    // ASCII-encoded UserComment per EXIF spec: 8-byte code header + text
    exifObj["Exif"][piexif.ExifIFD.UserComment] = "ASCII\u0000\u0000\u0000" + (note || '');
    const exifBytes = piexif.dump(exifObj);
    return piexif.insert(exifBytes, jpegDataUrl);
  }catch(e){
    console.error('EXIF embed failed, saving photo without it', e);
    return jpegDataUrl;
  }
}

// Combines a clean base photo + note into the final displayable/exportable
// JPEG: burns the (up to 5-line) caption onto the pixels, then embeds the
// FULL note text into EXIF regardless of what was visually truncated.
async function buildFinalPhoto(basePhoto, note){
  let annotated;
  try{
    annotated = await annotatePhoto(basePhoto, note);
  }catch(e){
    console.error('Annotation failed, using plain photo', e);
    annotated = basePhoto;
  }
  return embedNoteAsExif(annotated, note);
}

// ---------- rendering the currently-selected item ----------
function renderCurrentItem(){
  const atEnd = cursor >= entries.length - 1; // true when viewing the newest item, or there are none yet

  if(entries.length === 0){
    photoSlot.innerHTML = '<div class="hint">Press › below to photograph your first item</div>';
    noteBox.value = '';
    countLabel.textContent = 'New item';
  } else {
    const entry = entries[cursor];
    photoSlot.innerHTML = '';
    const img = document.createElement('img');
    img.src = entry.photo;
    photoSlot.appendChild(img);
    noteBox.value = entry.note || '';
    countLabel.textContent = 'No. ' + entry.id + ' — ' + (cursor+1) + ' of ' + entries.length;
    resetZoom();
  }

  // Forward doubles as "take a new photo" once you're at the newest item.
  forwardBtn.textContent = atEnd ? '📷 New Item' : 'Next ›';
  backBtn.disabled = (cursor <= 0 || entries.length === 0);

  // Retake only makes sense once there's an item to retake. It's a label
  // tied to the file input (for reliable native camera opening), so
  // "disabling" it means removing that association entirely rather than
  // just adding a disabled attribute, which labels don't support.
  if(entries.length === 0){
    retakeBtn.removeAttribute('for');
    retakeBtn.classList.add('disabled');
  } else {
    retakeBtn.setAttribute('for', 'fileInput');
    retakeBtn.classList.remove('disabled');
  }
}

// Commits any pending debounced note edit immediately — called before
// navigating away, retaking a photo, or switching tabs, so an edit is
// never silently lost or overwritten by a stale view.
async function flushNoteSave(){
  if(noteSaveTimer){
    clearTimeout(noteSaveTimer);
    noteSaveTimer = null;
    await commitNoteEdit();
  }
}

// Re-burns the caption and re-saves the entry currently being viewed,
// using whatever's in the note box right now. No-op if there's nothing
// yet, or the text hasn't actually changed.
async function commitNoteEdit(){
  if(entries.length === 0) return;
  const entry = entries[cursor];
  const newNote = noteBox.value.trim();
  if(newNote === (entry.note || '')) return;
  entry.note = newNote;
  entry.photo = await buildFinalPhoto(entry.basePhoto, newNote);
  try{
    await store.set('entry:'+entry.id, entry);
  }catch(e){
    console.error('Auto-save failed:', e);
    showToast('Auto-save failed: ' + (e && e.message ? e.message : 'unknown error'));
    return;
  }
  // only refresh the visible photo if we're still looking at this same entry
  if(entries[cursor] === entry){
    const img = photoSlot.querySelector('img');
    if(img) img.src = entry.photo;
  }
}

noteBox.addEventListener('input', ()=>{
  if(entries.length === 0) return; // nothing to autosave yet — note starts fresh with the next photo
  clearTimeout(noteSaveTimer);
  noteSaveTimer = setTimeout(commitNoteEdit, NOTE_AUTOSAVE_DELAY_MS);
});

// Fires when the camera/photo picker returns a photo. Branches on
// captureMode (set just before the picker opened) to decide whether this
// creates a brand-new item or overwrites the one currently being viewed.
fileInput.addEventListener('change', async (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  clearTimeout(noteSaveTimer); noteSaveTimer = null; // we're about to write fresh below; supersede any pending debounce

  const mode = captureMode;
  photoSlot.innerHTML = '<div class="hint">Processing photo…</div>';

  let basePhoto;
  try{
    basePhoto = await compressAndOrient(file);
  }catch(err){
    showToast('Could not read that photo — try again');
    renderCurrentItem();
    return;
  }

  const note = noteBox.value.trim();
  const finalPhoto = await buildFinalPhoto(basePhoto, note);

  if(mode === 'new'){
    const entry = { id: generateEntryId(), basePhoto, photo: finalPhoto, note, time: Date.now() };
    try{
      await store.set('entry:'+entry.id, entry);
    }catch(err){
      console.error(err);
      showToast('Save failed: ' + (err && err.message ? err.message : 'unknown error'));
      fileInput.value = '';
      renderCurrentItem();
      return;
    }
    entries.push(entry);
    cursor = entries.length - 1; // now viewing the item we just created
    showToast('Saved — No. ' + entry.id);
  } else {
    const entry = entries[cursor];
    entry.basePhoto = basePhoto;
    entry.photo = finalPhoto;
    entry.note = note;
    try{
      await store.set('entry:'+entry.id, entry);
    }catch(err){
      console.error(err);
      showToast('Save failed: ' + (err && err.message ? err.message : 'unknown error'));
    }
    showToast('Retaken — No. ' + entry.id);
  }

  fileInput.value = '';
  logTabCount.textContent = entries.length;
  renderLog();
  renderCurrentItem();
  noteBox.focus();
});

// Retake button: replaces the current item's photo. Kept functionally
// disabled (no `for` attribute, so tapping it does nothing) whenever
// there's no item yet to retake — see renderCurrentItem.
retakeBtn.addEventListener('click', ()=>{
  if(entries.length === 0) return;
  captureMode = 'retake';
});

backBtn.addEventListener('click', async ()=>{
  await flushNoteSave();
  if(cursor <= 0) return;
  cursor -= 1;
  renderCurrentItem();
});

// Forward is also a <label for="fileInput"> (see HTML) so that, at the end
// of the list, tapping it reliably opens the camera the same native way.
// When it should instead just navigate, we cancel that default behavior
// with preventDefault() and move the cursor ourselves.
forwardBtn.addEventListener('click', (e)=>{
  const atEnd = entries.length === 0 || cursor >= entries.length - 1;
  if(!atEnd){
    e.preventDefault(); // cancel the label's native "open file picker" action
    (async ()=>{
      await flushNoteSave();
      cursor += 1;
      renderCurrentItem();
    })();
    return;
  }
  // atEnd: let the native label behavior open the picker; prep state first.
  captureMode = 'new';
  noteBox.value = '';
  flushNoteSave(); // persists any pending edit on the item we're leaving, without blocking the picker from opening
});

// ---------- tab switching ----------
tabCapture.addEventListener('click', ()=>{
  tabCapture.classList.add('active'); tabLog.classList.remove('active');
  captureView.style.display='flex'; logView.style.display='none';
});
tabLog.addEventListener('click', async ()=>{
  await flushNoteSave();
  tabLog.classList.add('active'); tabCapture.classList.remove('active');
  logView.style.display='block'; captureView.style.display='none';
  renderLog();
});

// ---------- exporting ----------
// Plain-text copy of every note (no photos) — a quick way to review or
// paste the whole log elsewhere.
exportTextBtn.addEventListener('click', async ()=>{
  const lines = entries.map(e=>`No. ${e.id} — ${new Date(e.time).toLocaleString()}\n${e.note || '(no note)'}\n`);
  const text = lines.join('\n');
  try{
    await navigator.clipboard.writeText(text);
    showToast('Log copied to clipboard');
  }catch(e){
    showToast('Copy failed — select text manually');
  }
});

// Adds one numbered .jpg per entry (001.jpg, 002.jpg, ...) into the zip,
// in the order the photos were taken. Uses the final annotated+EXIF photo,
// never the internal clean basePhoto.
function buildZipEntries(zip, allEntries){
  allEntries
    .slice()
    .sort((a,b)=>a.time-b.time)
    .forEach(e=>{
      const base64 = e.photo.split(',')[1];
      zip.file(e.id+'.jpg', base64, {base64:true});
    });
}

// Hands a finished zip off to the user. Prefers Android's native share
// sheet (navigator.share) over a plain <a download> link, because a plain
// download link can get silently blocked on mobile once enough time has
// passed since the user's last tap — the share sheet has no such limit,
// and it also lets the user pick exactly where the file goes (Files,
// Drive, etc.) instead of guessing afterward.
async function downloadBlob(blob, filename){
  try{
    const file = new File([blob], filename, {type: 'application/zip'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title: filename});
      return;
    }
  }catch(shareErr){
    // user cancelled the share sheet, or sharing isn't available here — fall back below
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}

// Exports everything as a single zip. Filename is a sortable timestamp
// (e.g. 2026_10_31_222135.zip) so repeated exports never collide or need
// manual renaming.
exportAllBtn.addEventListener('click', async ()=>{
  await flushNoteSave();
  if(!entries.length){ showToast('Nothing to export yet'); return; }
  if(typeof JSZip === 'undefined'){ showToast('Zip library failed to load — check connection'); return; }
  showToast('Building zip…');
  try{
    const zip = new JSZip();
    buildZipEntries(zip, entries);
    const blob = await zip.generateAsync({type:'blob'});
    await downloadBlob(blob, timestampString() + '.zip');
    showToast('Zip ready');
  }catch(e){
    console.error(e);
    showToast('Export failed — see console');
  }
});

// ---------- startup ----------
// Runs once when the page loads: figures out which storage backend
// actually works here, adjusts photo size/quality accordingly, and then
// loads whatever was already saved.
async function init(){
  storageBackend = await detectStorageBackend();
  const notice = document.getElementById('storageNotice');
  if(storageBackend === 'ls'){
    PHOTO_MAX_W = 1000;
    PHOTO_QUALITY = 0.7;
    notice.style.display = 'block';
    notice.textContent = '⚠ Running in limited storage mode (this page was likely opened as a local file rather than a real web address). Each item now stores two photo copies internally (so notes can be re-edited later), so you\u2019ll have room for roughly 8–10 items total before storage fills up — export a .zip as you go, and remove saved items from the Log tab afterward to free up space. Hosting this page at a real https:// address removes this limit entirely.';
  } else {
    notice.style.display = 'none';
  }
  await loadEntries();
}
init();
</script>
</body>
</html>
